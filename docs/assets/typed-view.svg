<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="780" viewBox="0 0 1280 780">
<defs>
  <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#7aa2f7"/>
  </marker>
  <marker id="arrow2" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
    <path d="M0,0 L0,6 L9,3 z" fill="#9ece6a"/>
  </marker>
</defs>
<rect width="1280" height="780" fill="#15171c"/>
<text x="40" y="52" fill="#e6e8ec" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="26" font-weight="600">类型化视图 = 按资产类分派的“定义卡”</text>
<text x="40" y="82" fill="#8b9099" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="15">同一份 cooked 数据，从“UE 序列化结构”变成“AI 能直接读的稳定字段”</text>

<!-- Layer 1 -->
<rect x="40" y="120" width="300" height="120" rx="10" fill="#1d2027" stroke="#3a3f48"/>
<text x="58" y="148" fill="#c9ccd3" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600">① 原始层</text>
<text x="58" y="174" fill="#8b9099" font-family="Consolas, monospace" font-size="12">uasset / uexp</text>
<text x="58" y="196" fill="#8b9099" font-family="Consolas, monospace" font-size="12">→ CUE4Parse UObject</text>
<text x="58" y="218" fill="#8b9099" font-family="Consolas, monospace" font-size="12">→ propertiesJson</text>

<rect x="40" y="260" width="300" height="250" rx="10" fill="#1a1d23" stroke="#3a3f48"/>
<text x="58" y="288" fill="#c9ccd3" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="14" font-weight="600">propertiesJson（通用树）</text>
<text x="58" y="314" fill="#d7a86e" font-family="Consolas, monospace" font-size="11">Properties: {</text>
<text x="58" y="334" fill="#a9b1d6" font-family="Consolas, monospace" font-size="11">  Parent: { ObjectName: "MIC'MLI_..." },</text>
<text x="58" y="354" fill="#a9b1d6" font-family="Consolas, monospace" font-size="11">  ScalarParameterValues: [</text>
<text x="58" y="374" fill="#8b9099" font-family="Consolas, monospace" font-size="11">    { ParameterInfo: { Name: "Tiling" },</text>
<text x="58" y="394" fill="#8b9099" font-family="Consolas, monospace" font-size="11">      ParameterValue: 1.0 } ],</text>
<text x="58" y="414" fill="#a9b1d6" font-family="Consolas, monospace" font-size="11">  TextureParameterValues: [</text>
<text x="58" y="434" fill="#8b9099" font-family="Consolas, monospace" font-size="11">    { ParameterInfo: { Name: "Difuse_Map" },</text>
<text x="58" y="454" fill="#8b9099" font-family="Consolas, monospace" font-size="11">      ParameterValue: { ObjectPath: "..." } } ]</text>
<text x="58" y="474" fill="#d7a86e" font-family="Consolas, monospace" font-size="11">}</text>
<text x="58" y="496" fill="#e06c75" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">字段是 UE 内部命名，层级深、按类变化</text>

<!-- Layer 2 -->
<rect x="390" y="120" width="270" height="500" rx="10" fill="#1b2430" stroke="#3d5a80"/>
<text x="408" y="150" fill="#c9ccd3" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600">② 类型分派器</text>
<text x="408" y="174" fill="#8b9099" font-family="Consolas, monospace" font-size="12">class name → normalizer</text>

<rect x="408" y="196" width="234" height="52" rx="8" fill="#22262e" stroke="#4a4f59"/>
<text x="422" y="218" fill="#e0a458" font-family="Consolas, monospace" font-size="12">MaterialInstanceConstant</text>
<text x="422" y="237" fill="#8b9099" font-family="Consolas, monospace" font-size="11">→ material card</text>

<rect x="408" y="260" width="234" height="52" rx="8" fill="#22262e" stroke="#4a4f59"/>
<text x="422" y="282" fill="#7dcfff" font-family="Consolas, monospace" font-size="12">BlueprintGeneratedClass</text>
<text x="422" y="301" fill="#8b9099" font-family="Consolas, monospace" font-size="11">→ blueprint card</text>

<rect x="408" y="324" width="234" height="52" rx="8" fill="#22262e" stroke="#4a4f59"/>
<text x="422" y="346" fill="#a9b1d6" font-family="Consolas, monospace" font-size="12">DataTable</text>
<text x="422" y="365" fill="#8b9099" font-family="Consolas, monospace" font-size="11">→ table card</text>

<rect x="408" y="388" width="234" height="52" rx="8" fill="#22262e" stroke="#4a4f59"/>
<text x="422" y="410" fill="#e0a458" font-family="Consolas, monospace" font-size="12">Texture2D</text>
<text x="422" y="429" fill="#8b9099" font-family="Consolas, monospace" font-size="11">→ texture card</text>

<rect x="408" y="452" width="234" height="52" rx="8" fill="#22262e" stroke="#4a4f59"/>
<text x="422" y="474" fill="#f7768e" font-family="Consolas, monospace" font-size="12">AnimSequence</text>
<text x="422" y="493" fill="#8b9099" font-family="Consolas, monospace" font-size="11">→ animation card</text>

<text x="408" y="556" fill="#8b9099" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">未识别类 → 通用属性卡（降级）</text>
<text x="408" y="582" fill="#e06c75" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="12">没有 mapping 时字段可能缺失</text>

<!-- Layer 3 -->
<rect x="700" y="120" width="540" height="500" rx="10" fill="#1a211c" stroke="#3f5a45"/>
<text x="718" y="150" fill="#c9ccd3" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600">③ 定义卡（稳定 schema）</text>
<text x="718" y="174" fill="#8b9099" font-family="Consolas, monospace" font-size="12">每张卡都有：path · class · parent</text>

<rect x="718" y="192" width="504" height="76" rx="8" fill="#20261f" stroke="#4a5f4e"/>
<text x="732" y="214" fill="#e0a458" font-family="Consolas, monospace" font-size="12">MaterialCard</text>
<text x="732" y="236" fill="#c9ccd3" font-family="Consolas, monospace" font-size="11">params.scalars · params.textures{name→path}</text>
<text x="732" y="254" fill="#8b9099" font-family="Consolas, monospace" font-size="11">blendMode · twoSided · overrides</text>

<rect x="718" y="280" width="504" height="88" rx="8" fill="#20261f" stroke="#4a5f4e"/>
<text x="732" y="302" fill="#7dcfff" font-family="Consolas, monospace" font-size="12">BlueprintCard</text>
<text x="732" y="324" fill="#c9ccd3" font-family="Consolas, monospace" font-size="11">parentClass · interfaces · cdoDefaults · variables</text>
<text x="732" y="342" fill="#8b9099" font-family="Consolas, monospace" font-size="11">functions[{name, flags, bytecodeBytes}] · components</text>
<text x="732" y="360" fill="#e06c75" font-family="Consolas, monospace" font-size="11">（普通 BP 通常没有节点图；AnimBP 有 AnimGraph 节点）</text>

<rect x="718" y="380" width="504" height="64" rx="8" fill="#20261f" stroke="#4a5f4e"/>
<text x="732" y="402" fill="#a9b1d6" font-family="Consolas, monospace" font-size="12">DataTableCard</text>
<text x="732" y="424" fill="#c9ccd3" font-family="Consolas, monospace" font-size="11">rowStruct · rowCount · rows[n]（可 paging）</text>

<rect x="718" y="456" width="504" height="64" rx="8" fill="#20261f" stroke="#4a5f4e"/>
<text x="732" y="478" fill="#e0a458" font-family="Consolas, monospace" font-size="12">TextureCard</text>
<text x="732" y="500" fill="#c9ccd3" font-family="Consolas, monospace" font-size="11">width · height · format · mips · hasAlpha</text>

<rect x="718" y="532" width="504" height="64" rx="8" fill="#20261f" stroke="#4a5f4e"/>
<text x="732" y="554" fill="#f7768e" font-family="Consolas, monospace" font-size="12">AnimCard</text>
<text x="732" y="576" fill="#c9ccd3" font-family="Consolas, monospace" font-size="11">length · rateScale · skeleton · notifies</text>

<!-- arrows -->
<line x1="340" y1="300" x2="390" y2="300" stroke="#7aa2f7" stroke-width="2" marker-end="url(#arrow)"/>
<line x1="660" y1="222" x2="718" y2="230" stroke="#9ece6a" stroke-width="2" marker-end="url(#arrow2)"/>
<line x1="660" y1="286" x2="718" y2="320" stroke="#9ece6a" stroke-width="2" marker-end="url(#arrow2)"/>
<line x1="660" y1="350" x2="718" y2="410" stroke="#9ece6a" stroke-width="2" marker-end="url(#arrow2)"/>
<line x1="660" y1="414" x2="718" y2="485" stroke="#9ece6a" stroke-width="2" marker-end="url(#arrow2)"/>
<line x1="660" y1="478" x2="718" y2="560" stroke="#9ece6a" stroke-width="2" marker-end="url(#arrow2)"/>

<!-- AI -->
<rect x="40" y="650" width="1200" height="96" rx="10" fill="#1b2430" stroke="#3d5a80"/>
<text x="60" y="680" fill="#e6e8ec" font-family="Segoe UI, Microsoft YaHei, sans-serif" font-size="16" font-weight="600">④ AI 侧</text>
<text x="60" y="708" fill="#c9ccd3" font-family="Consolas, monospace" font-size="13">不用了解 FProperty / FPackageIndex / ObjectName，只读语义字段：</text>
<text x="60" y="730" fill="#9ece6a" font-family="Consolas, monospace" font-size="13">material.params.textures["Difuse_Map"] → "b1/.../T_WuKong_BaiYi_Cloth_01_D.uasset"</text>
<text x="60" y="730" fill="#9ece6a" font-family="Consolas, monospace" font-size="13" opacity="0"> </text>
<text x="720" y="730" fill="#7dcfff" font-family="Consolas, monospace" font-size="13">blueprint.parentClass · blueprint.functions[] · blueprint.cdoDefaults</text>
</svg>